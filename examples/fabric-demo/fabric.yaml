# Demo instrumentation fabric (docs/FABRIC.md v0).
#
# A small REAL fabric: fabric.kicad_pcb was generated by pcbnew scripting
# (gen_board.py) from the stock KiCad footprint libraries. It holds three
# sites — two op-amp gain sites and one decoupling site. It is deliberately
# UNROUTED for v0: the fit / DNP-stuffing semantics don't depend on routing.
# A real production fabric would be fully placed AND routed here, once, by a
# human — that routing then amortizes across every design compiled onto it.
#
# Value-stuffing convention: each op-amp site bakes rg_ohms (the gain-set
# resistor, R102/R202 = 1k) into the routed topology and leaves `gain` as the
# stuff-time dim. gain drives R1 = (gain-1)*rg_ohms (the feedback resistor,
# R101/R201). Fragment refs (R1,R2,U1) map to board refs by refdes-prefix
# grouping (R1->R101, R2->R102, U1->U101).
fabric:
  name: demo-fabric
  board: fabric.kicad_pcb
  sites:
    - id: amp0
      cell: core/opamp-gain-noninverting
      refs: [U101, R101, R102]
      params_fixed: {rg_ohms: 1000.0}
      params_stuffable: [gain]
    - id: amp1
      cell: core/opamp-gain-noninverting
      refs: [U201, R201, R202]
      params_fixed: {rg_ohms: 1000.0}
      params_stuffable: [gain]
    - id: dec0
      cell: core/decoupling
      refs: [C101]
      params_fixed: {}
      params_stuffable: []
  tie_off:
    amp0: {policy: dnp-all, note: "op-amp inputs held by fabric tie-off pulls"}
    amp1: {policy: dnp-all, note: "op-amp inputs held by fabric tie-off pulls"}
    dec0: {policy: dnp-all, note: "omitting a bypass cap is inert"}
