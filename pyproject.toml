[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infersynth"
version = "2.0.0a0"
description = "Inference and synthesis of PCBs from Functional Requirements Documents"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
panel = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
reqif = [
    "reqif>=0.0.40",
]
mcp = [
    "mcp>=1.0",
]
lsp = [
    "pygls>=1.3,<2",
]
embeddings = [
    "sentence-transformers>=2.2",
]

[project.scripts]
infersynth = "infersynth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["infersynth"]

# The catalog DATA (191 cell/interface/taxonomy files) lives at the repo root,
# a sibling of the package; callers find it via `infersynth.__file__.parent.parent
# / "catalog"`. Ship it at the wheel root so that lookup resolves post-install
# (site-packages/catalog) exactly as it does in the dev tree.
[tool.hatch.build.targets.wheel.force-include]
"catalog" = "catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "kicad: requires kicad-cli on PATH (skipped cleanly when absent)",
    "sysc_ams: requires a SystemC-AMS toolchain (skipped cleanly when absent)",
    "slow: long-running (multi-second) simulation tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
