[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infersynth"
version = "2.0.0a0"
description = "Inference and synthesis of PCBs from Functional Requirements Documents"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
infersynth = "infersynth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["infersynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "kicad: test shells out to kicad-cli (skipped when it is not on PATH)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
