[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infersynth"
version = "2.0.0a0"
description = "Inference and synthesis of PCBs from Functional Requirements Documents"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
panel = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
reqif = [
    "reqif>=0.0.40",
]
mcp = [
    "mcp>=1.0",
]
lsp = [
    "pygls>=1.3,<2",
]

[project.scripts]
infersynth = "infersynth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["infersynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "kicad: requires kicad-cli on PATH (skipped cleanly when absent)",
    "sysc_ams: requires a SystemC-AMS toolchain (skipped cleanly when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
