# ADC driver RC filter — SEED_PLAN.md sec 2 signal-path cell (Ch 4/§13,
# "driving converters"). Fragment authored via KiCAD-MCP-Server, same
# conventions as the golden cells: hierarchical labels coincident with pin
# endpoints, 1.27mm grid, ${IS.*} value slot.
#
# Topology: a series resistor (R1) between IN and OUT isolates the driving
# source from the converter's sampling-capacitor kickback; a shunt capacitor
# (C1) from OUT to GND forms the classic single-pole RC anti-alias/settling
# network right at the ADC input pin. OUT is both the filter node and the
# port the converter's sample-and-hold connects to.
manifest:
  name: adc-driver-rc
  version: "0.1.0"
  description: Series-R + shunt-C driver/anti-alias network for an ADC input.
  provenance: "AoE 3rd ed. ch. 4 / sec 13 (driving converters) topology (reference only; re-expressed from scratch; verify against book)"
  license: GPL-3.0-or-later
  # A resistor and a capacitor, no active silicon -> passive.
  technology: passive

ports:
  IN: {direction: in, kind: electrical}
  OUT: {direction: out, kind: electrical}
  GND: {direction: in, kind: power}

idioms:
  keywords:
    - adc driver
    - rc snubber
    - anti-alias rc
  # SELECTION.md sec 3: frequency shaping is the filtering tag verbatim.
  functions:
    - filtering
  params:
    r_ohms:
      type: float
      range: [1.0, 10000.0]
      default: 49.9
    c_farads:
      type: float
      range: [1.0e-12, 1.0e-6]
      default: 1.0e-9

bindings:
  R1: "r_ohms"
  C1: {expr: "c_farads", format: capacitance}

selection:
  # Freeform stub per DESIGN.md section 5 — v2 scoring engine input.
  archetype_symbol: Device:R
  qualification: null

verification:
  golden_netlist: golden_netlist.txt

depth:
  level: L0

# SELECTION.md sec 6: starter cost vector. BOM figures are rough, plausible
# placeholder estimates (1 resistor + 1 capacitor at typical distributor
# pricing), not a sourced real BOM; dev_hours is 0 (no firmware/config
# engineering).
costs:
  bom: {qty1: 0.06, qty1k: 0.015}
  area_mm2: 6
  power_mw: 0
  part_count: 2
  dev_hours: 0
  production_steps: []
  sourcing_risk: 0
