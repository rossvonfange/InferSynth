# at typical distributor pricing), not a sourced real BOM; dev_hours is 0 (no
# firmware/config engineering).
costs:
  bom: {qty1: 1.25, qty1k: 0.50}
  area_mm2: 60
  power_mw: 5
  part_count: 6
  dev_hours: 0
  production_steps: []
  sourcing_risk: 1
