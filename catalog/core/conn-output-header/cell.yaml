# IOB connector cell (SEED_PLAN.md sec 2, structural-only): 4-pin output header.
# Fragment authored 2026-07-06 via KiCAD-MCP-Server, same conventions as the
# golden cells (opamp-gain-noninverting): hierarchical labels coincident with
# pin endpoints, 1.27mm grid. No sim model — this cell exercises the sim
# gate's graceful-degradation path (model/ and testbench/ are empty stubs).
manifest:
  name: conn-output-header
  version: "0.1.0"
  description: 4-pin signal output header (OUT, REF, GND, SHIELD).
  provenance: "generic connectivity, no external source"
  license: GPL-3.0-or-later
  # See conn-power-2pin's comment: connectors are electromechanical (the
  # mechanical mating interface is what defines them), not passive.
  technology: electromechanical

ports:
  OUT: {direction: passive, kind: electrical}
  REF: {direction: passive, kind: electrical}
  GND: {direction: passive, kind: power}
  SHIELD: {direction: passive, kind: electrical}

idioms:
  keywords:
    - output header
    - output connector
  functions:
    - connectivity

selection:
  # SEED BINDINGS (plausible-but-unreviewed): real, orderable MPNs paired
  # with sensible KiCad stock footprints (SEED_PLAN acceptance criterion 4).
  # Engineer-nod level, NOT a sourced/reviewed BOM. Every fragment ref is
  # covered by exactly one candidate; value-parametric refs share one.
  candidates:
    - mpn: "61300411121"
      manufacturer: "Wurth Elektronik"
      footprint: "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical"
      maps: {J1: true}
      sourcing: {digikey: 732-5317-ND}
  # Freeform stub per DESIGN.md section 5 — v2 scoring engine input.
  archetype_symbol: Connector_Generic:Conn_01x04
  qualification: null

verification:
  golden_netlist: golden_netlist.txt

depth:
  level: L0

# SELECTION.md sec 6: starter cost vector. BOM figures are rough, plausible
# placeholder estimates, not a sourced real BOM; dev_hours is 0 (no firmware/
# config engineering — structural-only cell).
costs:
  bom: {qty1: 0.20, qty1k: 0.07}
  area_mm2: 45
  power_mw: 0
  part_count: 1
  dev_hours: 0
  production_steps: []
  sourcing_risk: 0
