# Golden cell #1 — the format-settling artifact (SEED_PLAN.md Phase 0).
# Fragment authored 2026-07-06 via KiCAD-MCP-Server (feat/upstream-contribution build);
# conventions it froze: ports = hierarchical labels coincident with pin endpoints;
# parameter slots = ${IS.<name>} in Value fields; ERC gate runs on a generated
# harness parent, never the naked fragment.
manifest:
  name: opamp-gain-noninverting
  version: "0.1.0"
  description: Non-inverting op-amp gain stage (gain = 1 + Rf/Rg).
  provenance: "AoE 3rd ed. ch. 4 topology (reference only; re-expressed from scratch)"
  license: GPL-3.0-or-later
  # The gain-setting element is an op-amp IC (archetype_symbol below); the
  # feedback resistors are passive but don't define the cell's technology —
  # the active device does.
  technology: analog-ic

ports:
  IN: {direction: in, kind: electrical}
  OUT: {direction: out, kind: electrical}
  VCC: {direction: in, kind: power}
  VEE: {direction: in, kind: power}
  GND: {direction: in, kind: power}

idioms:
  keywords:
    - amplifier gain stage
    - non-inverting amplifier
  # SELECTION.md sec 3: gain stage is the amplification tag verbatim
  # ("gain, buffering, drive").
  functions:
    - amplification
  params:
    gain:
      type: float
      range: [1.0, 1000.0]
    rg_ohms:
      type: float
      range: [100.0, 100000.0]
      default: 1000.0

bindings:
  # ${IS.<name>} slots in fragment.kicad_sch, computed from idiom params at
  # instantiation. Expressions evaluate in a restricted arithmetic namespace;
  # results are E96-snapped by the binder (v2 scope) or emitted verbatim (v1).
  R1: "(gain - 1) * rg_ohms"   # feedback resistor, ohms
  R2: "rg_ohms"                # gain-set resistor, ohms

selection:
  # SEED BINDINGS (plausible-but-unreviewed): real, orderable MPNs paired
  # with sensible KiCad stock footprints (SEED_PLAN acceptance criterion 4).
  # Engineer-nod level, NOT a sourced/reviewed BOM. Every fragment ref is
  # covered by exactly one candidate; value-parametric refs share one.
  candidates:
    - mpn: "OPA340NA/250"
      manufacturer: "Texas Instruments"
      footprint: "Package_TO_SOT_SMD:SOT-23-5"
      maps: {U1: true}
      sourcing: {digikey: OPA340NA/250-ND}
    - mpn: "RC0603FR-0710KL"
      manufacturer: "Yageo"
      footprint: "Resistor_SMD:R_0603_1608Metric"
      maps: {R1: true, R2: true}
      sourcing: {lcsc: C25804}
  # Freeform stub per DESIGN.md section 5 — v2 scoring engine input.
  opamp_class: general_purpose
  archetype_symbol: Amplifier_Operational:OPA340NA
  qualification: null

verification:
  golden_netlist: golden_netlist.txt   # net -> {ref/pin} partition captured at authoring

depth:
  level: L0

# SELECTION.md sec 6: starter cost vector. BOM figures are rough, plausible
# placeholder estimates (general-purpose op-amp + 2 resistors at typical
# distributor pricing), not a sourced real BOM; dev_hours is 0 (no firmware/
# config engineering).
costs:
  bom: {qty1: 0.90, qty1k: 0.35}
  area_mm2: 40
  power_mw: 5
  part_count: 3
  dev_hours: 0
  production_steps: []
  sourcing_risk: 1
