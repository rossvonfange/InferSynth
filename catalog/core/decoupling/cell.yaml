# Per-IC decoupling/bypass capacitor pattern (SEED_PLAN.md sec 2, structural-only).
# Fragment authored 2026-07-06 via KiCAD-MCP-Server, same conventions as the
# golden cells (opamp-gain-noninverting): hierarchical labels coincident with
# pin endpoints, 1.27mm grid, ${IS.*} value slot. No sim model — this cell
# exercises the sim gate's graceful-degradation path (model/ and testbench/
# are empty stubs).
#
# Binding format-hint extension (WP1 loader, this cell's contribution): a
# binding entry may be a bare expression string (existing form) OR a mapping
# {expr: <string>, format: <hint>}. `format` is presentational metadata for
# downstream consumers that render the bound value (e.g. panel/templates.py,
# a future BOM/value formatter) — it does not change binder semantics: the
# expression still evaluates to a plain float in farads via the same
# restricted grammar (infersynth.bind.expr), same as an ohms-valued binding.
# `format: capacitance` documents that C1's bound value should be rendered
# with capacitance-appropriate units/suffixes rather than the ohms default.
manifest:
  name: decoupling
  version: "0.1.0"
  description: Per-IC decoupling/bypass capacitor pattern.
  provenance: "generic connectivity, no external source"
  license: GPL-3.0-or-later
  # A decoupling cap is a passive electrical component through and through —
  # no active silicon, no mechanical mating interface. Contrast with the
  # connector cells above (electromechanical) and the op-amp cells below
  # (analog-ic).
  technology: passive

ports:
  VCC: {direction: passive, kind: power}
  GND: {direction: passive, kind: power}

idioms:
  keywords:
    - decoupling
    - bypass capacitor
  # SELECTION.md sec 3 taxonomy has no literal "decoupling" tag; the two
  # closest candidates are regulation ("rail generation and conditioning")
  # and filtering ("frequency shaping"). Chosen: filtering — a decoupling cap
  # does not generate or hold up the rail's DC level (that's the regulator/
  # LDO's job, the case "regulation" is meant for); it shunts HF noise/
  # transients off the rail at the point of use, i.e. it shapes the rail's
  # frequency content. That is filtering, applied to a supply net rather
  # than a signal net.
  functions:
    - filtering
  params:
    c_farads:
      type: float
      range: [1.0e-9, 1.0e-4]
      default: 1.0e-7

bindings:
  C1: {expr: "c_farads", format: capacitance}

selection:
  # SEED BINDINGS (plausible-but-unreviewed): real, orderable MPNs paired
  # with sensible KiCad stock footprints (SEED_PLAN acceptance criterion 4).
  # Engineer-nod level, NOT a sourced/reviewed BOM. Every fragment ref is
  # covered by exactly one candidate; value-parametric refs share one.
  candidates:
    - mpn: "CL10B104KB8NNNC"
      manufacturer: "Samsung"
      footprint: "Capacitor_SMD:C_0603_1608Metric"
      maps: {C1: true}
      sourcing: {lcsc: C14663}
  # Freeform stub per DESIGN.md section 5 — v2 scoring engine input.
  archetype_symbol: Device:C
  qualification: null

verification:
  golden_netlist: golden_netlist.txt

depth:
  level: L0

# SELECTION.md sec 6: starter cost vector. BOM figures are rough, plausible
# placeholder estimates (a single generic 0603 ceramic cap), not a sourced
# real BOM; dev_hours is 0 (no firmware/config engineering).
costs:
  bom: {qty1: 0.02, qty1k: 0.003}
  area_mm2: 2
  power_mw: 0
  part_count: 1
  dev_hours: 0
  production_steps: []
  sourcing_risk: 0
